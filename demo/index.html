<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Agent Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e4e7ec;
    --border-strong: #d0d5dd;
    --text: #101828;
    --text-2: #475467;
    --muted: #98a2b3;
    --accent: #2a78d6;          /* series-1: 카카오 T, 강조 */
    --accent-soft: #eaf2fc;
    --series-2: #eb6834;        /* series-2: 우버 */
    --track: #eef0f3;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /* 상단 바 */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--text); display: grid; place-items: center; }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  .brand small { font-weight: 500; color: var(--muted); margin-left: 6px; }
  .badge-demo { margin-left: auto; font-size: 12px; color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; background: var(--surface-2); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 24px 56px; display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 22px 24px; }
  h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: -.01em; }
  .sub { color: var(--text-2); font-size: 13px; }

  /* 입력 */
  .label { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
  form { display: flex; gap: 10px; }
  .field { flex: 1; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-strong); border-radius: 10px; padding: 0 14px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .field input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; padding: 13px 0; background: transparent; color: var(--text); }
  .btn { border: 0; border-radius: 10px; padding: 0 20px; font: inherit; font-weight: 600; color: #fff; background: var(--text); cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .45; cursor: default; }
  .hint { margin: 10px 2px 0; font-size: 12.5px; color: var(--muted); }
  .hint.warn { color: var(--text-2); }

  /* 진행 단계 */
  .app-chip { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .app-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); font-weight: 700; }
  .app-chip b { display: block; font-size: 15px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 28px 120px 1fr; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--border); color: var(--muted); }
  .step:last-child { border-bottom: 0; }
  .step .name { font-weight: 600; }
  .step.active, .step.done { color: var(--text); }
  .step .detail { color: var(--text-2); opacity: 0; transition: opacity .3s; }
  .step.done .detail { opacity: 1; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; }
  .step.active .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.done .dot { border-color: var(--accent); background: var(--accent); }
  .step.done .dot::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 보고서 */
  .report { display: grid; gap: 16px; animation: rise .45s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--track); border-radius: 11px; width: fit-content; }
  .tab { border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text-2); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { padding: 16px 18px; }
  .kpi .k { font-size: 12.5px; color: var(--text-2); }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .kpi .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }

  .summary { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--text); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* 가로 막대 */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 34px; align-items: center; gap: 10px; }
  .bar-row .n { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { height: 10px; background: var(--track); border-radius: 4px; position: relative; }
  .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); width: 0; transition: width .7s cubic-bezier(.2, .7, .2, 1); }
  .bar-row .val { font-size: 13px; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }

  /* 우선순위 매트릭스 */
  .matrix { display: grid; grid-template-columns: 70px 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 6px; }
  .axis { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; text-align: center; }
  .cell { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface-2); min-height: 92px; }
  .cell.q1 { background: var(--accent-soft); border-color: #cfe0f6; }
  .cell .qn { font-size: 12.5px; font-weight: 700; display: flex; justify-content: space-between; }
  .cell .qn span { color: var(--text-2); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .chip { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; }
  .cell.q1 .chip { border-color: #cfe0f6; color: var(--accent); }

  /* 개선안 목록 */
  .issues { list-style: none; margin: 0; padding: 0; }
  .issue { border-top: 1px solid var(--border); }
  .issue:first-child { border-top: 0; }
  .issue-head { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 16px; gap: 12px; align-items: center; padding: 13px 4px; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--track); font-size: 12px; font-weight: 700; display: grid; place-items: center; color: var(--text-2); }
  .issue[data-q="1"] .rank { background: var(--accent); color: #fff; }
  .issue-title { font-weight: 600; }
  .issue-meta { font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
  .tags { display: flex; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
  .tag.q1 { background: var(--accent-soft); border-color: #cfe0f6; color: var(--accent); font-weight: 600; }
  .chev { transition: transform .2s; color: var(--muted); }
  .issue.open .chev { transform: rotate(180deg); }
  .issue-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .issue.open .issue-body { grid-template-rows: 1fr; }
  .issue-body > div { overflow: hidden; }
  .detail-grid { margin: 0 4px 16px 46px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); display: grid; gap: 10px; }
  .detail-grid dt { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .detail-grid dd { margin: 2px 0 0; }
  .refs { display: flex; flex-wrap: wrap; gap: 4px; }
  .ref { font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* 비교 */
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .cmp { display: grid; gap: 14px; }
  .cmp-row { display: grid; grid-template-columns: 170px 1fr 92px; gap: 14px; align-items: center; }
  .cmp-row .n { font-size: 13px; font-weight: 600; }
  .cmp-bars { display: grid; gap: 4px; }
  .cmp-line { display: grid; grid-template-columns: 1fr 40px; gap: 8px; align-items: center; }
  .cmp-line .track { height: 8px; }
  .cmp-line .fill.s2 { background: var(--series-2); }
  .cmp-line .val { font-size: 12px; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
  .cmp-line .none { font-size: 12px; color: var(--muted); }
  .diff { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .diff.na { font-weight: 500; font-size: 12px; color: var(--muted); }
  .divider { height: 1px; background: var(--border); margin: 6px 0; }
  .insight { margin-top: 18px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .insight b { display: block; font-size: 12.5px; margin-bottom: 4px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* 분석 후 입력·진행 카드를 대신하는 한 줄 바 */
  .donebar { display: flex; align-items: center; gap: 14px; padding: 14px 20px; animation: rise .35s ease both; }
  .donebar .app-icon { width: 32px; height: 32px; border-radius: 8px; font-size: 13px; }
  .donebar b { font-size: 14px; }
  .flow { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; flex-wrap: wrap; }
  .flow span { font-variant-numeric: tabular-nums; }
  .flow .arrow { color: var(--muted); }
  .ok { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; }
  .link { margin-left: auto; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer; }

  .tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--text); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 7px; max-width: 260px; opacity: 0; transition: opacity .12s; }
  footer { text-align: center; font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .step { grid-template-columns: 28px 1fr; }
    .step .detail { grid-column: 2; }
    .cmp-row { grid-template-columns: 1fr; gap: 6px; }
    .diff { text-align: left; }
    .issue-head { grid-template-columns: 30px 1fr 16px; }
    .issue-head .tags { grid-column: 2; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
    </div>
    <div class="brand">Review Agent<small>앱 리뷰 분석 에이전트</small></div>
    <span class="badge-demo">Demo</span>
  </div>
</header>

<main class="wrap">
  <section class="card donebar" id="donebar" hidden>
    <div class="app-icon">T</div>
    <b id="done-name"></b>
    <div class="flow" id="done-flow"></div>
    <button class="link" id="again">다른 앱 분석</button>
  </section>

  <section class="card card-pad" id="input-card">
    <div class="label">분석할 앱</div>
    <form id="form" autocomplete="off">
      <label class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="앱 이름 또는 플레이스토어 링크" aria-label="앱 이름">
      </label>
      <button class="btn" id="go">분석 시작</button>
    </form>
    <p class="hint" id="hint">예: 카카오 T</p>
  </section>

  <section class="card card-pad" id="progress" hidden>
    <div class="app-chip">
      <div class="app-icon">T</div>
      <div><b id="app-name"></b><span class="sub" id="app-meta"></span></div>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="report" id="report" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="analysis">분석 보고서</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="compare">경쟁 앱 비교</button>
    </div>

    <div id="tab-analysis" class="report">
      <div class="kpis" id="kpis"></div>
      <div class="card card-pad">
        <h2>요약</h2>
        <ul class="summary" id="summary"></ul>
      </div>
      <div class="grid-2">
        <div class="card card-pad">
          <h2>문제 카테고리 <span class="sub">관련 리뷰 수</span></h2>
          <div class="bars" id="cats"></div>
        </div>
        <div class="card card-pad">
          <h2>우선순위 <span class="sub">영향도 × 난이도</span></h2>
          <div class="matrix" id="matrix"></div>
        </div>
      </div>
      <div class="card card-pad">
        <h2>개선안 <span class="sub" id="issue-count"></span></h2>
        <ul class="issues" id="issues"></ul>
      </div>
    </div>

    <div id="tab-compare" class="report" hidden>
      <div class="card card-pad">
        <h2>공통 카테고리별 언급 비율</h2>
        <div class="legend" id="legend"></div>
        <div class="cmp" id="cmp"></div>
        <div class="insight" id="insight"></div>
        <p class="note" id="cmp-note"></p>
      </div>
    </div>
  </section>

  <footer>저장된 실제 실행 결과로 재생하는 데모입니다. 분석: claude-sonnet-5-5</footer>
</main>
<div class="tooltip" id="tip"></div>

<script>
const D = window.DEMO_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = v => Math.round(v * 100) + "%";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const KNOWN = /카카오\s*t|kakao\s*t|kakaot|com\.kakao\.taxi|카카오택시/i;

/* 툴팁: data-tip이 있는 요소 위에서 표시 */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY + 16) + "px";
  tip.style.opacity = 1;
});

const STEPS = [
  { name: "리뷰 수집", detail: () => `${D.app.store} 최신 리뷰 ${D.steps.collected}개` },
  { name: "분류", detail: () => `앱 관련 ${D.steps.kept}개 · 무관 ${D.steps.excluded}개 제외` },
  { name: "분석", detail: () => `문제 카테고리 ${D.steps.categories}개 · 개선안 ${D.steps.issues}개` },
  { name: "검증", detail: () => `근거 리뷰 · 필수 항목 · 숫자 확인 통과 (제출 ${D.steps.submits}회, 반려 ${D.steps.rejected}회)` },
];

async function run(query) {
  const hint = $("#hint");
  if (!KNOWN.test(query)) {
    hint.textContent = "이 데모에는 카카오 T의 실행 결과만 들어 있습니다. '카카오 T'를 입력해 보세요.";
    hint.classList.add("warn");
    return;
  }
  hint.classList.remove("warn");
  hint.textContent = "분석 중…";
  $("#go").disabled = true;
  $("#app-name").textContent = D.app.name;
  $("#app-meta").textContent = `${D.app.store} · ${D.app.appId}`;
  $("#steps").innerHTML = STEPS.map(s => `<li class="step"><span class="dot"></span><span class="name">${s.name}</span><span class="detail">${esc(s.detail())}</span></li>`).join("");
  $("#report").hidden = true;
  $("#progress").hidden = false;
  const items = [...document.querySelectorAll(".step")];
  for (const li of items) {
    li.classList.add("active");
    await sleep(850);
    li.classList.replace("active", "done");
  }
  await sleep(700);
  hint.textContent = "분석 완료";
  $("#go").disabled = false;
  collapse();
  renderReport();
}

/* 분석이 끝나면 입력·진행 카드를 한 줄로 접어 보고서가 위에서부터 보이게 함 */
function collapse() {
  const s = D.steps;
  $("#done-name").textContent = D.app.name;
  $("#done-flow").innerHTML = `<span>리뷰 ${s.collected}개</span><span class="arrow">→</span><span>앱 관련 ${s.kept}개</span>
    <span class="arrow">→</span><span>개선안 ${s.issues}개</span><span class="arrow">→</span>
    <span class="ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>검증 통과</span>`;
  $("#input-card").hidden = true;
  $("#progress").hidden = true;
  $("#donebar").hidden = false;
  scrollTo(0, 0);
}

function renderReport() {
  const s = D.steps;
  $("#kpis").innerHTML = [
    ["분석한 리뷰", s.collected, "개"], ["앱 관련 리뷰", s.kept, "개"],
    ["문제 카테고리", s.categories, "개"], ["개선안", s.issues, "개"],
  ].map(([k, v, u]) => `<div class="card kpi"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join("");

  $("#summary").innerHTML = D.summary.map(l => `<li>${esc(l)}</li>`).join("");

  const max = Math.max(...D.categories.map(c => c.count));
  $("#cats").innerHTML = D.categories.map(c => `
    <div class="bar-row" data-tip="${esc(c.name)}: 관련 리뷰 ${c.count}개">
      <span class="n">${esc(c.name)}</span>
      <div class="track"><div class="fill" data-w="${c.count / max * 100}"></div></div>
      <span class="val">${c.count}</span>
    </div>`).join("");

  const byQ = q => D.issues.filter(i => i.quadrant === q);
  const cell = (q, name) => `
    <div class="cell q${q}">
      <div class="qn">${name}<span>${byQ(q).length}개</span></div>
      <div class="chips">${byQ(q).map(i => `<span class="chip" data-rank="${i.rank}" data-tip="${i.rank}. ${esc(i.title)}">${i.rank}</span>`).join("")}</div>
    </div>`;
  $("#matrix").innerHTML = `
    <span></span><span class="axis">난이도 하·중</span><span class="axis">난이도 상</span>
    <span class="axis">영향도<br>높음</span>${cell(1, "바로 실행")}${cell(2, "중장기 과제")}
    <span class="axis">영향도<br>낮음</span>${cell(3, "여유 있을 때")}${cell(4, "보류")}`;

  $("#issue-count").textContent = `${D.issues.length}개 · 우선순위 순`;
  $("#issues").innerHTML = D.issues.map(i => `
    <li class="issue" data-q="${i.quadrant}" id="issue-${i.rank}">
      <button class="issue-head" aria-expanded="false">
        <span class="rank">${i.rank}</span>
        <span><div class="issue-title">${esc(i.title)}</div><div class="issue-meta">${esc(i.category)} · 근거 리뷰 ${i.evidence}개</div></span>
        <span class="tags"><span class="tag q${i.quadrant === 1 ? 1 : ""}">${i.quadrantName}</span><span class="tag">심각도 ${i.severity} · 난이도 ${i.difficulty}</span></span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="issue-body"><div><dl class="detail-grid">
        <div><dt>개선 방법</dt><dd>${esc(i.method)}</dd></div>
        <div><dt>기대 효과</dt><dd>${esc(i.effect)}</dd></div>
        <div><dt>근거 리뷰</dt><dd class="refs">${i.refs.map(n => `<span class="ref">#${n}</span>`).join("")}</dd></div>
      </dl></div></div>
    </li>`).join("");

  renderCompare();
  selectTab("analysis");
  $("#report").hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".fill[data-w]").forEach(f => f.style.width = f.dataset.w + "%")));
}

function renderCompare() {
  const C = D.compare;
  const max = Math.max(...C.rows.flatMap(r => r.values.filter(v => v != null)));
  $("#legend").innerHTML = C.apps.map((a, k) =>
    `<span><i style="background:var(${k ? "--series-2" : "--accent"})"></i>${esc(a.name)} (앱 관련 리뷰 ${a.analyzed}개)</span>`).join("");
  const line = (v, k, name, app) => v == null
    ? `<div class="cmp-line"><span class="none">해당 카테고리 없음</span><span></span></div>`
    : `<div class="cmp-line" data-tip="${esc(app)} · ${esc(name)}: ${pct(v)}"><div class="track"><div class="fill ${k ? "s2" : ""}" data-w="${v / max * 100}"></div></div><span class="val">${pct(v)}</span></div>`;
  const common = C.rows.filter(r => r.diff != null), only = C.rows.filter(r => r.diff == null);
  const row = r => `
    <div class="cmp-row">
      <span class="n">${esc(r.name)}</span>
      <div class="cmp-bars">${r.values.map((v, k) => line(v, k, r.name, C.apps[k].name)).join("")}</div>
      ${r.diff == null ? `<span class="diff na">한 앱에서만</span>` : `<span class="diff">${r.diff > 0 ? "+" : ""}${Math.round(r.diff * 100)}%p</span>`}
    </div>`;
  $("#cmp").innerHTML = common.map(row).join("") + (only.length ? `<div class="divider"></div>` + only.map(row).join("") : "");
  const w = C.weaknesses[0];
  $("#insight").innerHTML = w ? `<b>${esc(D.app.name)}의 약점 · ${esc(w["공통카테고리"])}</b>${esc(w["내용"])}` : "";
  $("#cmp-note").textContent = `${C.period} 리뷰 기준. 비율 = 그 문제를 언급한 리뷰 수 ÷ 앱 관련 리뷰 수. 차이 = ${C.apps[0].name} − ${C.apps[1].name}.`;
}

function selectTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
  $("#tab-analysis").hidden = name !== "analysis";
  $("#tab-compare").hidden = name !== "compare";
  requestAnimationFrame(() => document.querySelectorAll(`#tab-${name} .fill[data-w]`).forEach(f => {
    f.style.width = "0"; requestAnimationFrame(() => f.style.width = f.dataset.w + "%");
  }));
}

function toggleIssue(li, open) {
  const on = open ?? !li.classList.contains("open");
  li.classList.toggle("open", on);
  $(".issue-head", li).setAttribute("aria-expanded", on);
}

$("#form").addEventListener("submit", e => { e.preventDefault(); run($("#q").value.trim()); });
$("#again").addEventListener("click", () => {
  ["#donebar", "#report"].forEach(s => $(s).hidden = true);
  $("#input-card").hidden = false;
  $("#hint").textContent = "예: 카카오 T";
  $("#q").select();
});
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) selectTab(tab.dataset.tab);
  const head = e.target.closest(".issue-head"); if (head) toggleIssue(head.parentElement);
  const chip = e.target.closest(".chip");
  if (chip) { const li = $(`#issue-${chip.dataset.rank}`); toggleIssue(li, true); li.scrollIntoView({ behavior: "smooth", block: "center" }); }
});

/* ?autoplay: GIF 녹화용. 입력 → 진행 → 보고서 둘러보기 → 비교 탭 */
if (new URLSearchParams(location.search).has("autoplay")) (async () => {
  await document.fonts.ready;
  document.body.dataset.started = "1";   /* 녹화 스크립트가 여기서부터 자름 */
  const q = $("#q"); await sleep(900); q.focus();
  for (const ch of "카카오 T") { q.value += ch; await sleep(120); }
  await sleep(450);
  await run(q.value);
  const to = (el, offset = 16) => scrollTo({ top: el.getBoundingClientRect().top + scrollY - offset, behavior: "smooth" });
  await sleep(2200); to($("#matrix").closest(".grid-2"));
  await sleep(2600); to($("#issues").closest(".card"));
  await sleep(1000); toggleIssue($("#issue-1"), true);
  await sleep(2800); scrollTo({ top: 0, behavior: "smooth" });
  await sleep(900); selectTab("compare");
  await sleep(2600); to($("#insight"), 260);
  await sleep(1200);
  document.body.dataset.done = "1";   /* 녹화 스크립트가 끝을 알 수 있게 */
})();
</script>
</body>
</html>
